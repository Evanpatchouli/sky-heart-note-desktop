# On an Eotion host, the edge proxy and MongoDB already own these two networks.
services:
  server:
    networks:
      mongo: {}
      public_web:
        aliases: [sky-club-api, sky-heart-api]
  admin:
    networks:
      public_web:
        aliases: [sky-club-admin, sky-heart-admin]
  employee:
    networks:
      public_web:
        aliases: [sky-club-employee, sky-heart-employee]
  client:
    networks:
      public_web:
        aliases: [sky-club-client, sky-heart-client]
  site:
    networks:
      public_web:
        aliases: [sky-club-site, sky-heart-site]

networks:
  mongo:
    name: ${MONGO_NETWORK:-mongo}
    external: true
  public_web:
    name: ${PUBLIC_WEB_NETWORK:-public-web}
    external: true
