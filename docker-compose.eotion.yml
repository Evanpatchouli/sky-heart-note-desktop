# On an Eotion host, the edge proxy and MongoDB already own these two networks.
services:
  server:
    networks:
      mongo: {}
      public_web:
        aliases: [sky-club-api]
  admin:
    networks:
      public_web:
        aliases: [sky-club-admin]
  employee:
    networks:
      public_web:
        aliases: [sky-club-employee]
  client:
    networks:
      public_web:
        aliases: [sky-club-client]
  site:
    networks:
      public_web:
        aliases: [sky-club-site]

networks:
  mongo:
    name: ${MONGO_NETWORK:-mongo}
    external: true
  public_web:
    name: ${PUBLIC_WEB_NETWORK:-public-web}
    external: true
