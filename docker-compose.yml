name: sky-heart-note

x-web-args: &web-args
  VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:-http://localhost:${SERVER_PORT:-8793}/api}
  GIT_SHA: ${GIT_SHA:-unknown}

x-web-build: &web-build
  context: .
  dockerfile: deploy/frontend.Dockerfile

x-frontend: &frontend
  restart: unless-stopped
  networks: [app]
  depends_on:
    server:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 5s

services:
  mongodb:
    image: mongo:8
    profiles: [mongo]
    command:
      - bash
      - -ec
      - |
        : "$${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}" "$${SKY_MONGO_PASSWORD:?Set DB_MONGO_PASSWORD}"
        exec docker-entrypoint.sh mongod
    restart: unless-stopped
    networks: [database]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo-admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-sky-heart-note}
      SKY_MONGO_USER: ${DB_MONGO_USERNAME:-sky_heart}
      SKY_MONGO_PASSWORD: ${DB_MONGO_PASSWORD:-}
    volumes:
      - mongo-data:/data/db
      - ./deploy/init-mongo.js:/docker-entrypoint-initdb.d/10-sky-heart.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongodb", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  server:
    image: ${COMPOSE_PROJECT_NAME:-sky-heart-note}-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-8793}:8793"
    networks:
      app:
        aliases: [sky-heart-upstream]
      database: {}
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8793
      DB_MONGO_CONNECTION: ${DB_MONGO_CONNECTION:-mongodb://mongodb:27017/${MONGO_DB_NAME:-sky-heart-note}}
      DB_MONGO_USERNAME: ${DB_MONGO_USERNAME-sky_heart}
      DB_MONGO_PASSWORD: ${DB_MONGO_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-root}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CLUB_NAME: ${CLUB_NAME:-送心手记}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:${ADMIN_PORT:-5173}}
      EMPLOYEE_ORIGIN: ${EMPLOYEE_ORIGIN:-http://localhost:${EMPLOYEE_PORT:-5174}}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:${CLIENT_PORT:-5175}}
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:${SITE_PORT:-5176}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - employee-data:/app/server/data/employee
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8793/api/site').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  admin:
    <<: *frontend
    image: ${COMPOSE_PROJECT_NAME:-sky-heart-note}-admin:latest
    build:
      <<: *web-build
      args:
        <<: *web-args
        WEB_APP: admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5173}:80"

  employee:
    <<: *frontend
    image: ${COMPOSE_PROJECT_NAME:-sky-heart-note}-employee:latest
    build:
      <<: *web-build
      args:
        <<: *web-args
        WEB_APP: employee
    ports:
      - "127.0.0.1:${EMPLOYEE_PORT:-5174}:80"

  client:
    <<: *frontend
    image: ${COMPOSE_PROJECT_NAME:-sky-heart-note}-client:latest
    build:
      <<: *web-build
      args:
        <<: *web-args
        WEB_APP: client
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5175}:80"

  site:
    <<: *frontend
    image: ${COMPOSE_PROJECT_NAME:-sky-heart-note}-site:latest
    build:
      <<: *web-build
      args:
        <<: *web-args
        WEB_APP: site
    ports:
      - "127.0.0.1:${SITE_PORT:-5176}:80"

networks:
  app:
  database:
    internal: true

volumes:
  employee-data:
    name: ${EMPLOYEE_VOLUME_NAME:-${COMPOSE_PROJECT_NAME:-sky-heart-note}_employee-data}
  mongo-data:
