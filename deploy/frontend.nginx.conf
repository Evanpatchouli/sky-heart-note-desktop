map $http_x_forwarded_proto $frontend_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the Compose service after an independent API redeployment.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ ^/api(?:/|$) {
        set $api sky-heart-upstream:8793;
        proxy_pass http://$api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $frontend_forwarded_proto;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /service-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|map|svg|ico|png|jpe?g|gif|webp|woff2?)$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
